name: grad-besu
services:
  a:
    restart: 'no'
    cpus: 2
    command:
      - --config-file=/config/node.toml
      - --p2p-host=172.28.61.11
    environment:
      JAVA_OPTS: -Xms256m -Xmx512m
    image: hyperledger/besu@sha256:3d6ac0368d449c13c4ba075acac90d6b96afa5b3113295385d88c4d5122c8808
    mem_limit: "1342177280"
    networks:
      ledger:
        ipv4_address: 172.28.61.11
    pids_limit: 512
    platform: linux/arm64
    stop_grace_period: 30s
    user: '501:20'
    volumes:
      - type: bind
        source: /Users/yjydist/Desktop/graduation-design/infra/besu/node.toml
        target: /config/node.toml
        read_only: true
        bind: {}
      - type: bind
        source: /Users/yjydist/Desktop/graduation-design/.local/besu-qbft/genesis.json
        target: /config/genesis.json
        read_only: true
        bind: {}
      - type: bind
        source: /Users/yjydist/Desktop/graduation-design/.local/besu-qbft/static-nodes.json
        target: /config/static-nodes.json
        read_only: true
        bind: {}
      - type: bind
        source: /Users/yjydist/Desktop/graduation-design/.local/besu-qbft/nodes/A
        target: /data
        bind: {}
    ports:
      - mode: ingress
        host_ip: 127.0.0.1
        target: 8545
        published: "18545"
        protocol: tcp
